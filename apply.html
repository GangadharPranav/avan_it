<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Portal — AVAN IT Solutions</title>
  <meta name="description" content="Submit your career or learning program application to AVAN IT Solutions." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300E5FF'/><text y='.9em' font-size='75' x='10' font-weight='900'>AV</text></svg>" />

  <!-- Kage Design System & Fonts -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="css/main.css?v=2.0.0" />
  <link rel="stylesheet" href="css/animations.css?v=2.0.0" />
  <link rel="stylesheet" href="css/creative.css?v=2.0.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00f0ff",
            "secondary": "#8a2be2",
            "vermilion": "#e0231c",
            "surface-dark": "#05070a"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "display": ["Space Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: transparent !important; color: #dfe7e0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .glass-card-apply {
      background: rgba(14, 18, 24, 0.28);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid rgba(223, 231, 224, 0.12);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 240, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .glass-card-apply::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.6), rgba(224, 35, 28, 0.6), transparent);
    }
    .kage-input {
      background: rgba(15, 21, 34, 0.35);
      border: 1px solid rgba(223, 231, 224, 0.15);
      color: #fff;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kage-input:focus {
      outline: none;
      border-color: #00f0ff !important;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25) !important;
      background: rgba(10, 14, 20, 0.95);
    }
    body > header, body > footer { display: none !important; }
  </style>
</head>
<body class="bg-[#05070a] selection:bg-[#e0231c] selection:text-white">
  <script src="js/components.js?v=2.0.0"></script>

  <main class="relative z-10 min-h-screen pt-32 pb-32 flex items-center justify-center">
    <div class="max-w-3xl w-full mx-auto px-6">
      
      <!-- Top Eyebrow Badge -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#00f0ff]/10 border border-[#00f0ff]/30 text-[#00f0ff] text-xs font-mono font-bold uppercase tracking-widest mb-4 shadow-[0_0_20px_rgba(0,240,255,0.2)]">
          <span class="w-2 h-2 rounded-full bg-[#00f0ff] animate-ping"></span>
          AVAN IT Enterprise Recruitment Portal
        </div>
        <h1 class="font-display text-4xl sm:text-5xl font-extrabold text-white tracking-tight">Application Submission</h1>
        <p class="text-[#aab4ad] text-sm mt-3 max-w-xl mx-auto">Direct submission line to AVAN Practice Leads &amp; Global Delivery Team in Hyderabad.</p>
      </div>

      <!-- Main Glass Card -->
      <div class="glass-card-apply p-8 sm:p-12 rounded-3xl space-y-8">
        
        <!-- Step Progress Bar -->
        <div class="flex items-center justify-between border-b border-white/10 pb-6 text-xs font-mono uppercase tracking-wider text-[#78837c]">
          <div class="flex items-center gap-2 text-[#00f0ff] font-bold">
            <span class="w-6 h-6 rounded-full bg-[#00f0ff]/20 border border-[#00f0ff] flex items-center justify-center text-[10px]">01</span>
            <span>Position Specs</span>
          </div>
          <div class="flex items-center gap-2 text-white/90">
            <span class="w-6 h-6 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-[10px]">02</span>
            <span>Candidate Info</span>
          </div>
          <div class="flex items-center gap-2 text-white/50">
            <span class="w-6 h-6 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-[10px]">03</span>
            <span>Review &amp; Submit</span>
          </div>
        </div>

        <form id="apply-form" onsubmit="handleApply(event)" class="space-y-6">
          
                <option value="90">90 Days</option>
              </select>
            </div>
          </div>

          <!-- Drag and Drop Resume Dropzone -->
          <div class="space-y-2">
            <label class="block text-xs font-semibold text-[#bac9cc] uppercase tracking-wider">Upload Resume (PDF / DOCX)</label>
            <div class="border-2 border-dashed border-white/10 hover:border-[#00e5ff]/40 rounded-2xl p-6 text-center transition-all bg-white/[0.01]">
              <span class="material-symbols-outlined text-3xl text-[#00e5ff] mb-2">cloud_upload</span>
              <p class="text-xs text-white font-semibold">Click to upload or drag &amp; drop resume file</p>
              <p class="text-[0.7rem] text-[#849396] mt-1">Maximum file size: 10MB</p>
              <input type="file" id="apply-resume" accept=".pdf,.doc,.docx" class="hidden" onchange="document.getElementById('file-name').textContent = this.files[0]?.name || ''" />
              <button type="button" onclick="document.getElementById('apply-resume').click()" class="mt-3 px-4 py-1.5 bg-white/5 border border-white/10 text-xs text-white rounded-lg hover:bg-white/10">Browse Computer</button>
              <div id="file-name" class="text-xs text-[#00e5ff] font-bold mt-2"></div>
            </div>
          </div>

          <button type="submit" class="w-full py-4 bg-gradient-to-r from-[#00e5ff] to-[#7000ff] text-black font-bold rounded-xl text-sm hover:brightness-110 transition-all shadow-lg shadow-[#00e5ff]/20">
            Submit Application Profile →
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="js/main.js?v=1.0.6"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || urlParams.get('course') || 'Senior AI Architect';
      const targetInput = document.getElementById('apply-target');
      if (targetInput) targetInput.value = role;
    });

    function handleApply(e) {
      e.preventDefault();
      const name = document.getElementById('apply-name').value;
      const target = document.getElementById('apply-target').value;
      alert(`Thank you, ${name}! Your application for "${target}" has been submitted successfully to AVAN HR Team. Reference ID: AVAN-APP-${Math.floor(Math.random() * 89999 + 10000)}.`);
      window.location.href = 'careers.html';
    }
  </script>
</body>
</html>
